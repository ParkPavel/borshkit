<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-labelledby="t d" lang="ko">
<title id="t">Borshkit의 구조</title>
<desc id="d">Node.js 22+ · 의존성 없음 · 모든 것은 로컬에 저장. 결정과 기록은 핵심이 하고, 실행자는 제안만 합니다. 프로젝트에는 인수된 것만 들어갑니다.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk " d="M0 0L10 5L0 10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk red" d="M0 0L10 5L0 10z"/></marker><marker id="aokl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk okl" d="M0 0L10 5L0 10z"/></marker><marker id="awaitl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk waitl" d="M0 0L10 5L0 10z"/></marker><marker id="aoffl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk offl" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
:root{--bg:#fbf7f2;--ink:#2b1d1d;--muted:#6b5757;--red:#b3261e;--deep:#8c1c13;--line:#cdb9b5;--card:#fffdfa;--group:#f5ede7;--ok:#2e7d32;--okbg:#e6f2e6;--wait:#9a5b00;--waitbg:#fbefdc;--off:#7d6f6f;--offbg:#efe8e6;--steam:#c9a9a6;--hl:#fde8e5;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#171213;--ink:#f4ecea;--muted:#bfaeac;--red:#ef6b5f;--deep:#a8261b;--line:#5a4846;--card:#221a1a;--group:#1d1617;--ok:#7bc47f;--okbg:#1f2e20;--wait:#f0a64a;--waitbg:#33261a;--off:#9d8f8e;--offbg:#2a2222;--steam:#6e5856;--hl:#3a1f1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:var(--muted)}.cap{font-size:13px;fill:var(--muted)}
.b{font-size:13.5px;font-weight:650}.l{font-size:11.5px;fill:var(--muted)}.m{font-family:var(--mono);font-size:11px}.c{font-family:var(--mono);font-size:11.5px;fill:var(--red);font-weight:600}
.gl{font-size:11px;font-weight:700;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.al{font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.4}.grp{fill:var(--group);stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.ok .box,.box.ok{fill:var(--okbg);stroke:var(--ok)}.wait .box,.box.wait{fill:var(--waitbg);stroke:var(--wait)}.off .box,.box.off{fill:var(--offbg);stroke:var(--off)}.bad .box,.box.bad{fill:var(--hl);stroke:var(--red)}
.ln{fill:none;stroke:var(--line);stroke-width:1.6}.ln.red{stroke:var(--red)}.ln.okl{stroke:var(--ok)}.ln.waitl{stroke:var(--wait)}.ln.offl{stroke:var(--off)}.ln.dash{stroke-dasharray:5 4}
.mk{fill:var(--line)}.mk.red{fill:var(--red)}.mk.okl{fill:var(--ok)}.mk.waitl{fill:var(--wait)}.mk.offl{fill:var(--off)}
.tok{fill:var(--red);stroke:var(--bg);stroke-width:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tok{display:none}}.hl-you{animation:hl-you 19.37s linear infinite}@keyframes hl-you{0%,0.00%{stroke:var(--line);stroke-width:1.4}0.00%,3.10%{stroke:var(--red);stroke-width:2.6}3.70%,100%{stroke:var(--line);stroke-width:1.4}}.hl-g3{animation:hl-g3 19.37s linear infinite}@keyframes hl-g3{0%,18.86%{stroke:var(--line);stroke-width:1.4}19.46%,25.66%{stroke:var(--red);stroke-width:2.6}26.26%,100%{stroke:var(--line);stroke-width:1.4}}.hl-ex{animation:hl-ex 19.37s linear infinite}@keyframes hl-ex{0%,33.00%{stroke:var(--line);stroke-width:1.4}33.60%,39.79%{stroke:var(--red);stroke-width:2.6}40.39%,100%{stroke:var(--line);stroke-width:1.4}}.hl-copy{animation:hl-copy 19.37s linear infinite}@keyframes hl-copy{0%,58.82%{stroke:var(--line);stroke-width:1.4}59.42%,65.61%{stroke:var(--red);stroke-width:2.6}66.21%,100%{stroke:var(--line);stroke-width:1.4}}.hl-g2{animation:hl-g2 19.37s linear infinite}@keyframes hl-g2{0%,75.49%{stroke:var(--line);stroke-width:1.4}76.09%,83.31%{stroke:var(--red);stroke-width:2.6}83.91%,100%{stroke:var(--line);stroke-width:1.4}}.hl-project{animation:hl-project 19.37s linear infinite}@keyframes hl-project{0%,91.14%{stroke:var(--line);stroke-width:1.4}91.74%,100.00%{stroke:var(--red);stroke-width:2.6}100.00%,100%{stroke:var(--line);stroke-width:1.4}}</style>
<rect class="bg" width="980" height="660" rx="14"/>
<text class="ttl" x="20" y="36">Borshkit의 구조</text><text class="sub" x="20" y="56">Node.js 22+ · 의존성 없음 · 모든 것은 로컬에 저장</text>
<rect class="grp" x="20" y="74" width="182" height="380" rx="12"/><text class="gl" x="32" y="91">호출하는 쪽</text>
<g class="" id="you"><rect class="box hl-you" x="30" y="100" width="162" height="66" rx="9"/><text class="b" x="41" y="120">나</text><text class="m" x="41" y="138">borshkit …</text><text class="l" x="41" y="152.5">터미널 명령</text></g>
<g class=""><rect class="box" x="30" y="178" width="162" height="98" rx="9"/><text class="b" x="41" y="198">Claude Code</text><text class="l" x="41" y="216">플러그인: 훅, 스킬</text><text class="m" x="41" y="231">SessionStart</text><text class="m" x="41" y="245.5">PreToolUse</text></g>
<g class=""><rect class="box" x="30" y="288" width="162" height="66" rx="9"/><text class="b" x="41" y="308">Codex 등</text><text class="m" x="41" y="326">AGENTS.md</text><text class="l" x="41" y="340.5">AGENTS.md를 읽음</text></g>
<g class="wait"><rect class="box" x="30" y="360" width="162" height="86" rx="9"/><text class="b" x="41" y="380">나만 가능</text><text class="l" x="41" y="398">터미널에 문구 입력:</text><text class="l" x="41" y="413">보호 완화,</text><text class="l" x="41" y="428">병합, 푸시</text></g>
<rect class="grp" x="226" y="74" width="396" height="380" rx="12"/><text class="gl" x="238" y="91">core/ — 핵심</text>
<g class="" id="g1"><rect class="box hl-g1" x="238" y="100" width="372" height="76" rx="9"/><text class="b" x="249" y="120">작업 공간</text><text class="m" x="249" y="138">space · config · privacy · experiment · hooks</text><text class="l" x="249" y="152.5">설정은 제안을 통해서만 바뀜</text></g>
<g class="" id="g2"><rect class="box hl-g2" x="238" y="186" width="372" height="76" rx="9"/><text class="b" x="249" y="206">작업과 인수</text><text class="m" x="249" y="224">contract · snapshot · accept · builtins</text><text class="l" x="249" y="238.5">증거는 상태에 묶임</text></g>
<g class="" id="g4"><rect class="box hl-g4" x="238" y="272" width="372" height="76" rx="9"/><text class="b" x="249" y="292">지식과 Git</text><text class="m" x="249" y="310">kb · materials · gitshell · eval</text><text class="l" x="249" y="324.5">프로젝트 지도, 출처, 병합과 푸시</text></g>
<g class="" id="g3"><rect class="box hl-g3" x="238" y="358" width="372" height="76" rx="9"/><text class="b" x="249" y="378">작업 실행</text><text class="m" x="249" y="396">jobs · roles · team · resources</text><text class="m" x="249" y="410.5">adapters · executors · questions</text><text class="l" x="249" y="425">역할 + 실행자, 풀, 질문, 상황판</text></g>
<rect class="grp" x="646" y="74" width="314" height="380" rx="12"/><text class="gl" x="658" y="91">파일 위치</text>
<g class="" id="space"><rect class="box hl-space" x="656" y="100" width="294" height="156" rx="9"/><text class="b" x="667" y="120">borshkit/</text><text class="l" x="667" y="138">작업 공간 · Obsidian · 자체 Git 기록</text><text class="m" x="667" y="153">settings/workspace.json</text><text class="m" x="667" y="167.5">tasks/&lt;id&gt;/ contract · evidence</text><text class="m" x="667" y="182">  logs · acceptance.md</text><text class="m" x="667" y="196.5">jobs/ · questions/ · STATUS.md</text><text class="m" x="667" y="211">TEAM.md · .state/resources.json</text><text class="m" x="667" y="225.5">knowledge/ · materials/</text><text class="m" x="667" y="240">.state/ kb.sqlite · locks/</text></g>
<g class="" id="project"><rect class="box hl-project" x="656" y="268" width="294" height="74" rx="9"/><text class="b" x="667" y="288">프로젝트</text><text class="m" x="667" y="306">.gitignore: /borshkit/</text><text class="l" x="667" y="320.5">내 파일과 Git 기록</text></g>
<g class="" id="copy"><rect class="box hl-copy" x="656" y="364" width="294" height="80" rx="9"/><text class="b" x="667" y="384">작업 복사본</text><text class="m" x="667" y="402">../&lt;project&gt;.borshkit-worktrees/&lt;id&gt;</text><text class="l" x="667" y="416.5">git worktree · 브랜치 borshkit/&lt;id&gt;</text></g>
<rect class="grp" x="226" y="486" width="734" height="122" rx="12"/><text class="gl" x="238" y="503">실행자: 작업 묶음을 받고 스키마대로 JSON으로 답함</text>
<g class="" id="ex"><rect class="box hl-ex" x="238" y="512" width="168.5" height="80" rx="9"/><text class="b" x="249" y="532">Claude Code</text><text class="c" x="249" y="550">claude-cli</text><text class="l" x="249" y="565.5">구독으로</text></g>
<g class=""><rect class="box" x="418.5" y="512" width="168.5" height="80" rx="9"/><text class="b" x="429.5" y="532">Codex · GPT Image</text><text class="c" x="429.5" y="550">codex-cli</text><text class="l" x="429.5" y="565.5">구독으로</text></g>
<g class=""><rect class="box" x="599" y="512" width="168.5" height="80" rx="9"/><text class="b" x="610" y="532">모든 API · Ollama</text><text class="c" x="610" y="550">openai-compat</text><text class="l" x="610" y="565.5">키는 이름으로만</text></g>
<g class=""><rect class="box" x="779.5" y="512" width="168.5" height="80" rx="9"/><text class="b" x="790.5" y="532">자체 프로그램</text><text class="c" x="790.5" y="550">command</text><text class="l" x="790.5" y="565.5">stdin을 읽음</text></g>
