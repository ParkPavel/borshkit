<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" role="img" aria-labelledby="t d" lang="en">
<title id="t">The path of a task</title>
<desc id="d">every step leaves a record bound to the exact state of the files. A model saying “done” is not acceptance: checks, a review by another model family and you decide.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk " d="M0 0L10 5L0 10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk red" d="M0 0L10 5L0 10z"/></marker><marker id="aokl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk okl" d="M0 0L10 5L0 10z"/></marker><marker id="awaitl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk waitl" d="M0 0L10 5L0 10z"/></marker><marker id="aoffl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk offl" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
:root{--bg:#fbf7f2;--ink:#2b1d1d;--muted:#6b5757;--red:#b3261e;--deep:#8c1c13;--line:#cdb9b5;--card:#fffdfa;--group:#f5ede7;--ok:#2e7d32;--okbg:#e6f2e6;--wait:#9a5b00;--waitbg:#fbefdc;--off:#7d6f6f;--offbg:#efe8e6;--steam:#c9a9a6;--hl:#fde8e5;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#171213;--ink:#f4ecea;--muted:#bfaeac;--red:#ef6b5f;--deep:#a8261b;--line:#5a4846;--card:#221a1a;--group:#1d1617;--ok:#7bc47f;--okbg:#1f2e20;--wait:#f0a64a;--waitbg:#33261a;--off:#9d8f8e;--offbg:#2a2222;--steam:#6e5856;--hl:#3a1f1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:var(--muted)}.cap{font-size:13px;fill:var(--muted)}
.b{font-size:13.5px;font-weight:650}.l{font-size:11.5px;fill:var(--muted)}.m{font-family:var(--mono);font-size:11px}.c{font-family:var(--mono);font-size:11.5px;fill:var(--red);font-weight:600}
.gl{font-size:11px;font-weight:700;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.al{font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.4}.grp{fill:var(--group);stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.ok .box,.box.ok{fill:var(--okbg);stroke:var(--ok)}.wait .box,.box.wait{fill:var(--waitbg);stroke:var(--wait)}.off .box,.box.off{fill:var(--offbg);stroke:var(--off)}.bad .box,.box.bad{fill:var(--hl);stroke:var(--red)}
.ln{fill:none;stroke:var(--line);stroke-width:1.6}.ln.red{stroke:var(--red)}.ln.okl{stroke:var(--ok)}.ln.waitl{stroke:var(--wait)}.ln.offl{stroke:var(--off)}.ln.dash{stroke-dasharray:5 4}
.mk{fill:var(--line)}.mk.red{fill:var(--red)}.mk.okl{fill:var(--ok)}.mk.waitl{fill:var(--wait)}.mk.offl{fill:var(--off)}
.tok{fill:var(--red);stroke:var(--bg);stroke-width:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tok{display:none}}.hl-n1{animation:hl-n1 17.39s linear infinite}@keyframes hl-n1{0%,0.00%{stroke:var(--line);stroke-width:1.4}0.00%,5.18%{stroke:var(--red);stroke-width:2.6}5.78%,100%{stroke:var(--line);stroke-width:1.4}}.hl-n2{animation:hl-n2 17.39s linear infinite}@keyframes hl-n2{0%,11.55%{stroke:var(--line);stroke-width:1.4}12.15%,17.32%{stroke:var(--red);stroke-width:2.6}17.92%,100%{stroke:var(--line);stroke-width:1.4}}.hl-n3{animation:hl-n3 17.39s linear infinite}@keyframes hl-n3{0%,23.69%{stroke:var(--line);stroke-width:1.4}24.29%,32.35%{stroke:var(--red);stroke-width:2.6}32.95%,100%{stroke:var(--line);stroke-width:1.4}}.hl-n4a{animation:hl-n4a 17.39s linear infinite}@keyframes hl-n4a{0%,39.45%{stroke:var(--line);stroke-width:1.4}40.05%,46.95%{stroke:var(--red);stroke-width:2.6}47.55%,100%{stroke:var(--line);stroke-width:1.4}}.hl-n5{animation:hl-n5 17.39s linear infinite}@keyframes hl-n5{0%,53.15%{stroke:var(--line);stroke-width:1.4}53.75%,60.65%{stroke:var(--red);stroke-width:2.6}61.25%,100%{stroke:var(--line);stroke-width:1.4}}.hl-o4{animation:hl-o4 17.39s linear infinite}@keyframes hl-o4{0%,66.59%{stroke:var(--line);stroke-width:1.4}67.19%,72.94%{stroke:var(--red);stroke-width:2.6}73.54%,100%{stroke:var(--line);stroke-width:1.4}}.hl-m{animation:hl-m 17.39s linear infinite}@keyframes hl-m{0%,81.21%{stroke:var(--line);stroke-width:1.4}81.81%,87.57%{stroke:var(--red);stroke-width:2.6}88.17%,100%{stroke:var(--line);stroke-width:1.4}}.hl-p{animation:hl-p 17.39s linear infinite}@keyframes hl-p{0%,91.35%{stroke:var(--line);stroke-width:1.4}91.95%,100.00%{stroke:var(--red);stroke-width:2.6}100.00%,100%{stroke:var(--line);stroke-width:1.4}}.hl-n4b{animation:hl-n4b 17.39s linear infinite}@keyframes hl-n4b{0%,39.45%{stroke:var(--line);stroke-width:1.4}40.05%,46.95%{stroke:var(--red);stroke-width:2.6}47.55%,100%{stroke:var(--line);stroke-width:1.4}}</style>
<rect class="bg" width="980" height="590" rx="14"/>
<text class="ttl" x="20" y="36">The path of a task</text><text class="sub" x="20" y="56">every step leaves a record bound to the exact state of the files</text>
<g class="" id="n1"><rect class="box hl-n1" x="20" y="78" width="180" height="84" rx="9"/><text class="b" x="31" y="98">Task</text><text class="c" x="31" y="116">task new</text><text class="l" x="31" y="131.5">goal · criteria · paths</text></g>
<g class="" id="n2"><rect class="box hl-n2" x="214" y="78" width="180" height="84" rx="9"/><text class="b" x="225" y="98">Analysis</text><text class="c" x="225" y="116">task check</text><text class="l" x="225" y="131.5">blind spots up front</text></g>
<g class="" id="n3"><rect class="box hl-n3" x="408" y="78" width="180" height="84" rx="9"/><text class="b" x="419" y="98">Work</text><text class="c" x="419" y="116">job run</text><text class="l" x="419" y="131.5">implementer in the copy</text></g>
<g class="" id="n4a"><rect class="box hl-n4a" x="616" y="70" width="192" height="84" rx="9"/><text class="b" x="627" y="90">Checks (auto)</text><text class="c" x="627" y="108">task verify</text><text class="l" x="627" y="123.5">in the copy → log + sha256</text></g>
<g class="" id="n4b"><rect class="box hl-n4b" x="616" y="166" width="192" height="84" rx="9"/><text class="b" x="627" y="186">Review (model)</text><text class="c" x="627" y="204">--role reviewer</text><text class="l" x="627" y="219.5">a different model family</text></g>
<g class="" id="n5"><rect class="box hl-n5" x="830" y="104" width="130" height="112" rx="9"/><text class="b" x="841" y="124">Verdict</text><text class="c" x="841" y="142">task converge</text><text class="l" x="841" y="157.5">states</text><text class="l" x="841" y="172.5">compared</text><text class="m" x="841" y="187.5">acceptance.md</text></g>
<path class="ln red" d="M200 120 L214 120" marker-end="url(#ared)"/>
<path class="ln red" d="M394 120 L408 120" marker-end="url(#ared)"/>
<path class="ln red" d="M588 120 H600 M600 112 V208"/>
<path class="ln red" d="M600 112 L616 112" marker-end="url(#ared)"/>
<path class="ln red" d="M600 208 L616 208" marker-end="url(#ared)"/>
<path class="ln red" d="M808 112 L830 140" marker-end="url(#ared)"/>
<path class="ln red" d="M808 208 L830 180" marker-end="url(#ared)"/>
<g class="bad" id="o1"><rect class="box hl-o1" x="20" y="300" width="220" height="84" rx="9"/><text class="b" x="31" y="320">🔴 needs a fix</text><text class="l" x="31" y="338">FAIL from a check or review</text><text class="l" x="31" y="353">or edits outside paths</text></g>
<g class="off" id="o2"><rect class="box hl-o2" x="252" y="300" width="220" height="84" rx="9"/><text class="b" x="263" y="320">⚪ not checked</text><text class="l" x="263" y="338">no evidence</text><text class="l" x="263" y="353">or it went stale</text></g>
<g class="wait" id="o3"><rect class="box hl-o3" x="484" y="300" width="220" height="84" rx="9"/><text class="b" x="495" y="320">🟡 waits for you</text><text class="l" x="495" y="338">a manual criterion, or a</text><text class="l" x="495" y="353">model PASS without trust</text></g>
<g class="ok" id="o4"><rect class="box hl-o4" x="716" y="300" width="244" height="84" rx="9"/><text class="b" x="727" y="320">🟢 accepted</text><text class="l" x="727" y="338">every goal reached</text><text class="l" x="727" y="353">on this state</text></g>
<path class="ln" d="M895 216 V284 H130 M362 284 V300 M594 284 V300 M130 284 V300"/>
<path class="ln okl" d="M895 284 L895 300" marker-end="url(#aokl)"/>
<text class="al" x="888" y="272" text-anchor="end">one of the outcomes</text>
<path class="ln red dash" d="M60 300 L60 186 L498 186 L498 162" marker-end="url(#ared)"/><text class="al" x="118.79999999999998" y="181" text-anchor="middle">fix</text>
<path class="ln offl dash" d="M300 300 L300 232 L584 232 L584 208 L600 208"/><text class="al" x="408.40000000000003" y="227" text-anchor="middle">check again</text>
<g class="wait" id="you"><rect class="box hl-you" x="484" y="420" width="220" height="84" rx="9"/><text class="b" x="495" y="440">You</text><text class="c" x="495" y="458">task confirm</text><text class="l" x="495" y="473.5">steps from the acceptance sheet</text></g>
<path class="ln waitl" d="M594 384 L594 420" marker-end="url(#awaitl)"/>
<path class="ln waitl dash" d="M704 462 L714 462 L714 262 L870 262 L870 216" marker-end="url(#awaitl)"/><text class="al" x="759.44" y="257" text-anchor="middle">verdict again</text>
<g class="off" id="up"><rect class="box hl-up" x="252" y="420" width="220" height="84" rx="9"/><text class="b" x="263" y="440">Update the task</text><text class="c" x="263" y="458">task update</text><text class="l" x="263" y="473.5">main → into the copy, check again</text></g>
<g class="" id="m"><rect class="box hl-m" x="726" y="420" width="112" height="112" rx="9"/><text class="b" x="737" y="440">Merge</text><text class="c" x="737" y="458">merge</text><text class="l" x="737" y="473.5">copy is clean</text><text class="l" x="737" y="488.5">and contains</text><text class="l" x="737" y="503.5">current main</text></g>
<g class="" id="p"><rect class="box hl-p" x="848" y="420" width="112" height="112" rx="9"/><text class="b" x="859" y="440">Push</text><text class="c" x="859" y="458">push</text><text class="l" x="859" y="473.5">keys in all</text><text class="l" x="859" y="488.5">that is new</text><text class="l" x="859" y="503.5">to the remote</text></g>
<path class="ln okl" d="M782 384 L782 420" marker-end="url(#aokl)"/>
<path class="ln okl" d="M838 476 L848 476" marker-end="url(#aokl)"/>
<path class="ln offl dash" d="M726 520 L362 520 L362 504" marker-end="url(#aoffl)"/><text class="al" x="593" y="534" text-anchor="middle">main moved on</text>
<path class="ln offl dash" d="M362 420 L362 384" marker-end="url(#aoffl)"/>
<circle class="tok" r="7" cx="0" cy="0"><animateMotion dur="17.39s" repeatCount="indefinite" path="M110 120 L304 120 L498 120 L600 120 L712 112 L895 160 L895 284 L895 342 L782 342 L782 476 L904 476" keyPoints="0.0000;0.0000;0.1445;0.1445;0.2890;0.2890;0.3650;0.4486;0.4486;0.5896;0.5896;0.6819;0.7251;0.7251;0.8093;0.9091;0.9091;1.0000;1.0000" keyTimes="0.0000;0.0518;0.1215;0.1732;0.2429;0.3235;0.3601;0.4005;0.4695;0.5375;0.6065;0.6510;0.6719;0.7294;0.7700;0.8181;0.8757;0.9195;1.0000" calcMode="linear"/></circle>
<text class="cap" x="20" y="572">A model saying “done” is not acceptance: checks, a review by another model family and you decide.</text>
</svg>
