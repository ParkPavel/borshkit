<g class="" id="ex"><rect class="box hl-ex" x="238" y="512" width="168.5" height="80" rx="9"/><text class="b" x="249" y="532">Claude · Gemini CLI</text><text class="c" x="249" y="550">claude-cli · gemini-cli</text><text class="l" x="249" y="565.5">по подписке</text></g>
<g class=""><rect class="box" x="418.5" y="512" width="168.5" height="80" rx="9"/><text class="b" x="429.5" y="532">Codex · GPT Image</text><text class="c" x="429.5" y="550">codex-cli</text><text class="l" x="429.5" y="565.5">по подписке</text></g>
<g class=""><rect class="box" x="599" y="512" width="168.5" height="80" rx="9"/><text class="b" x="610" y="532">Любой API · Ollama</text><text class="c" x="610" y="550">openai-compat · gemini-api</text><text class="l" x="610" y="565.5">ключ — по имени</text></g>
<g class=""><rect class="box" x="779.5" y="512" width="168.5" height="80" rx="9"/><text class="b" x="790.5" y="532">Своя программа</text><text class="c" x="790.5" y="550">command</text><text class="l" x="790.5" y="565.5">читает stdin</text></g>
