<g class=""><rect class="box" x="30" y="178" width="162" height="98" rx="9"/><text class="b" x="41" y="198">Claude Code</text><text class="l" x="41" y="216">плагин: хуки, навык</text><text class="m" x="41" y="231">SessionStart</text><text class="m" x="41" y="245.5">PreToolUse</text></g>
<g class=""><rect class="box" x="30" y="288" width="162" height="66" rx="9"/><text class="b" x="41" y="308">Codex и другие</text><text class="m" x="41" y="326">AGENTS.md</text><text class="l" x="41" y="340.5">читают AGENTS.md</text></g>
<g class="wait"><rect class="box" x="30" y="360" width="162" height="86" rx="9"/><text class="b" x="41" y="380">Только ты</text><text class="l" x="41" y="398">терминал / passkey</text><text class="l" x="41" y="413">настройки: passkey</text><text class="l" x="41" y="428">Git: терминал</text></g>
<rect class="grp" x="226" y="74" width="396" height="380" rx="12"/><text class="gl" x="238" y="91">core/ — ядро</text>
<g class="" id="g1"><rect class="box hl-g1" x="238" y="100" width="372" height="76" rx="9"/><text class="b" x="249" y="120">Пространство</text><text class="m" x="249" y="138">space · setup · config · approvals</text><text class="l" x="249" y="152.5">настройки меняются только через предложения</text></g>
<g class="" id="g2"><rect class="box hl-g2" x="238" y="186" width="372" height="76" rx="9"/><text class="b" x="249" y="206">Задачи и приёмка</text><text class="m" x="249" y="224">contract · snapshot · accept · assessments</text><text class="l" x="249" y="238.5">доказательства привязаны к состоянию</text></g>
<g class="" id="g4"><rect class="box hl-g4" x="238" y="272" width="372" height="76" rx="9"/><text class="b" x="249" y="292">Знания и Git</text><text class="m" x="249" y="310">kb · materials · gitshell · portable</text><text class="l" x="249" y="324.5">карта проекта, источники, сборка и отправка</text></g>
<g class="" id="g3"><rect class="box hl-g3" x="238" y="358" width="372" height="76" rx="9"/><text class="b" x="249" y="378">Работы</text><text class="m" x="249" y="396">jobs · roles · team · resources · monitor</text><text class="m" x="249" y="410.5">adapters · executors · questions</text><text class="l" x="249" y="425">роль + исполнитель, пулы, вопросы, диспетчерская</text></g>
<rect class="grp" x="646" y="74" width="314" height="380" rx="12"/><text class="gl" x="658" y="91">Где лежат файлы</text>
<g class="" id="space"><rect class="box hl-space" x="656" y="100" width="294" height="156" rx="9"/><text class="b" x="667" y="120">borshkit/</text><text class="l" x="667" y="138">пространство · Obsidian · своя история Git</text><text class="m" x="667" y="153">settings/workspace.json</text><text class="m" x="667" y="167.5">tasks/&lt;id&gt;/ contract · evidence</text><text class="m" x="667" y="182">  logs · acceptance.md</text><text class="m" x="667" y="196.5">jobs/ · questions/ · STATUS.md</text><text class="m" x="667" y="211">TEAM.md · .state/resources.json</text><text class="m" x="667" y="225.5">knowledge/ · materials/</text><text class="m" x="667" y="240">.state/ kb.sqlite · locks/</text></g>
<g class="" id="project"><rect class="box hl-project" x="656" y="268" width="294" height="74" rx="9"/><text class="b" x="667" y="288">Проект</text><text class="m" x="667" y="306">.gitignore: /borshkit/</text><text class="l" x="667" y="320.5">твои файлы и история Git</text></g>
<g class="" id="copy"><rect class="box hl-copy" x="656" y="364" width="294" height="80" rx="9"/><text class="b" x="667" y="384">Копия задачи</text><text class="m" x="667" y="402">../&lt;project&gt;.borshkit-worktrees/&lt;id&gt;</text><text class="l" x="667" y="416.5">git worktree · ветка borshkit/&lt;id&gt;</text></g>
