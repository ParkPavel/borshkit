<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="t d" lang="de">
<title id="t">Wissen: Notizen → Graph und SQL → Kontext</title>
<desc id="d">Notizen sind die Quelle der Wahrheit; SQL ist abgeleitet und neu baubar. Die Karte liest JS/TS und Markdown; Swift, Python und Go noch nicht. Die Abnahme nutzt die Karte nicht.</desc>
