<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Borshkit · подтверждение</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script><main><h1>Подтверждение владельца</h1><p>Проверь действие перед подтверждением passkey. Настройки и запуск работ — отдельные действия.</p><label>Устройство<select id="device"></select></label><label>Действие<select id="action"><option value="apply-settings">Применить настройки</option><option value="answer-question">Ответить на критический вопрос</option></select></label><label>Предложение или вопрос<input id="target" autocomplete="off" required></label><label>Вариант ответа (для вопроса)<input id="option" autocomplete="off"></label><button id="preview">Показать действие</button><pre id="details" aria-live="polite"></pre><button id="approve" disabled>Подтвердить passkey</button><hr><h2>Первое сопряжение</h2><p>Создай passkey и передай публичный файл доверенному администратору для регистрации вне агентской сессии. Сам по себе файл ничего не разрешает.</p><button id="pair">Создать публичный файл устройства</button></main></html>
