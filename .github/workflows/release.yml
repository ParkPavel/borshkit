name: Release archive
# Прикладывает borshkit.tgz к релизу. Ставится одной командой:
#   npm install -g https://github.com/ParkPavel/borshkit/releases/latest/download/borshkit.tgz
# Скачивания этого файла и показывает счётчик в README.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег существующего релиза
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Версия пакета совпадает с тегом
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Тег $TAG, а в package.json $version" >&2
            exit 1
          fi
          node -e "const fs=require('fs');const v=require('./package.json').version;for(const f of ['.claude-plugin/plugin.json','integrations/vscode/package.json'])if(JSON.parse(fs.readFileSync(f)).version!==v)process.exit(1)"
      - run: npm run verify
      - run: |
          npm pack
          mv borshkit-*.tgz borshkit.tgz
          node scripts/vsix.mjs borshkit.vsix
          node scripts/provenance.mjs borshkit.tgz borshkit.vsix
      - name: Подписанное происхождение архивов GitHub
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3, verified ref 2026-10-09
        with:
          subject-path: |
            borshkit.tgz
            borshkit.vsix
      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" borshkit.tgz borshkit.vsix SHA256SUMS build-provenance.json --repo "$GITHUB_REPOSITORY"
