<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378" viewBox="0 0 1000 378" role="img" aria-labelledby="t d" lang="ru">
<title id="t">Видимая команда</title>
<desc id="d">Оценки ролей, ресурсы и независимость проверяются до предложения. Неизвестный остаток виден. Устаревшие данные требуют нового плана.. Подключение ≠ оценка роли. Выполненная работа ≠ приёмка.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk " d="M0 0L10 5L0 10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk red" d="M0 0L10 5L0 10z"/></marker><marker id="aokl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk okl" d="M0 0L10 5L0 10z"/></marker><marker id="awaitl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk waitl" d="M0 0L10 5L0 10z"/></marker><marker id="aoffl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk offl" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
:root{--bg:#fbf7f2;--ink:#2b1d1d;--muted:#6b5757;--red:#b3261e;--deep:#8c1c13;--line:#cdb9b5;--card:#fffdfa;--group:#f5ede7;--ok:#2e7d32;--okbg:#e6f2e6;--wait:#9a5b00;--waitbg:#fbefdc;--off:#7d6f6f;--offbg:#efe8e6;--steam:#c9a9a6;--hl:#fde8e5;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#171213;--ink:#f4ecea;--muted:#bfaeac;--red:#ef6b5f;--deep:#a8261b;--line:#5a4846;--card:#221a1a;--group:#1d1617;--ok:#7bc47f;--okbg:#1f2e20;--wait:#f0a64a;--waitbg:#33261a;--off:#9d8f8e;--offbg:#2a2222;--steam:#6e5856;--hl:#3a1f1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:var(--muted)}.cap{font-size:13px;fill:var(--muted)}
.b{font-size:13.5px;font-weight:650}.l{font-size:11.5px;fill:var(--muted)}.m{font-family:var(--mono);font-size:11px}.c{font-family:var(--mono);font-size:11.5px;fill:var(--red);font-weight:600}
.gl{font-size:11px;font-weight:700;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.al{font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.4}.grp{fill:var(--group);stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.ok .box,.box.ok{fill:var(--okbg);stroke:var(--ok)}.wait .box,.box.wait{fill:var(--waitbg);stroke:var(--wait)}.off .box,.box.off{fill:var(--offbg);stroke:var(--off)}.bad .box,.box.bad{fill:var(--hl);stroke:var(--red)}
.ln{fill:none;stroke:var(--line);stroke-width:1.6}.ln.red{stroke:var(--red)}.ln.okl{stroke:var(--ok)}.ln.waitl{stroke:var(--wait)}.ln.offl{stroke:var(--off)}.ln.dash{stroke-dasharray:5 4}
.mk{fill:var(--line)}.mk.red{fill:var(--red)}.mk.okl{fill:var(--ok)}.mk.waitl{fill:var(--wait)}.mk.offl{fill:var(--off)}
.tok{fill:var(--red);stroke:var(--bg);stroke-width:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tok{display:none}}</style>
<rect class="bg" width="1000" height="378" rx="14"/>
<text class="ttl" x="20" y="36">Видимая команда</text><text class="sub" x="20" y="56">Оценки ролей, ресурсы и независимость проверяются до предложения</text>
<g class=""><rect class="box" x="20" y="90" width="144" height="72" rx="9"/><text class="b" x="31" y="110">Задача</text><text class="m" x="31" y="128">contract.json</text></g>
<path class="ln red" d="M164 126 L180 126" marker-end="url(#ared)"/>
<g class=""><rect class="box" x="180" y="90" width="144" height="72" rx="9"/><text class="b" x="191" y="110">Роль</text><text class="m" x="191" y="128">roles/&lt;role&gt;</text></g>
<path class="ln red" d="M324 126 L340 126" marker-end="url(#ared)"/>
<g class=""><rect class="box" x="340" y="90" width="144" height="72" rx="9"/><text class="b" x="351" y="110">Исполнитель</text><text class="m" x="351" y="128">executors</text></g>
<path class="ln red" d="M484 126 L500 126" marker-end="url(#ared)"/>
<g class=""><rect class="box" x="500" y="90" width="144" height="72" rx="9"/><text class="b" x="511" y="110">Модель / API</text><text class="m" x="511" y="128">model · endpoint</text></g>
<path class="ln red" d="M644 126 L660 126" marker-end="url(#ared)"/>
<g class=""><rect class="box" x="660" y="90" width="144" height="72" rx="9"/><text class="b" x="671" y="110">Результат</text><text class="m" x="671" y="128">files · usage</text></g>
<path class="ln red" d="M804 126 L820 126" marker-end="url(#ared)"/>
<g class=""><rect class="box" x="820" y="90" width="144" height="72" rx="9"/><text class="b" x="831" y="110">Ревью</text><text class="m" x="831" y="128">other provider</text></g>
<g class=""><rect class="box" x="20" y="208" width="176" height="76" rx="9"/><text class="b" x="31" y="228">Предложено</text><text class="c" x="31" y="246">team propose</text></g>
<path class="ln " d="M196 246 L212 246" marker-end="url(#a)"/>
<g class=""><rect class="box" x="212" y="208" width="176" height="76" rx="9"/><text class="b" x="223" y="228">Применено</text><text class="c" x="223" y="246">settings apply</text></g>
<path class="ln " d="M388 246 L404 246" marker-end="url(#a)"/>
<g class=""><rect class="box" x="404" y="208" width="176" height="76" rx="9"/><text class="b" x="415" y="228">Запущено</text><text class="c" x="415" y="246">job run</text></g>
<path class="ln " d="M580 246 L596 246" marker-end="url(#a)"/>
<g class=""><rect class="box" x="596" y="208" width="176" height="76" rx="9"/><text class="b" x="607" y="228">Проверено</text><text class="c" x="607" y="246">task verify</text></g>
<path class="ln " d="M772 246 L788 246" marker-end="url(#a)"/>
<g class="ok"><rect class="box" x="788" y="208" width="176" height="76" rx="9"/><text class="b" x="799" y="228">Принято</text><text class="c" x="799" y="246">task converge</text></g>
<text class="cap" x="20" y="324">Неизвестный остаток виден. Устаревшие данные требуют нового плана.</text><text class="cap" x="20" y="350">Подключение ≠ оценка роли. Выполненная работа ≠ приёмка.</text>
</svg>
