<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="t d" lang="de">
<title id="t">Wie ein Auftrag seinen Ausführer findet</title>
<desc id="d">Kandidaten aus dem Pool der Reihe nach; jeder durchläuft vier Filter. claude: Limit erreicht → codex · codex: arbeitet… · codex: fertig ✓ · Wechsel: 1. Jede Übergabe steht in STATUS.md und in der Statuszeile; ein Mensch entscheidet nur beim Stopp.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk " d="M0 0L10 5L0 10z"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk red" d="M0 0L10 5L0 10z"/></marker><marker id="aokl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk okl" d="M0 0L10 5L0 10z"/></marker><marker id="awaitl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk waitl" d="M0 0L10 5L0 10z"/></marker><marker id="aoffl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk offl" d="M0 0L10 5L0 10z"/></marker></defs>
<style>
:root{--bg:#fbf7f2;--ink:#2b1d1d;--muted:#6b5757;--red:#b3261e;--deep:#8c1c13;--line:#cdb9b5;--card:#fffdfa;--group:#f5ede7;--ok:#2e7d32;--okbg:#e6f2e6;--wait:#9a5b00;--waitbg:#fbefdc;--off:#7d6f6f;--offbg:#efe8e6;--steam:#c9a9a6;--hl:#fde8e5;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#171213;--ink:#f4ecea;--muted:#bfaeac;--red:#ef6b5f;--deep:#a8261b;--line:#5a4846;--card:#221a1a;--group:#1d1617;--ok:#7bc47f;--okbg:#1f2e20;--wait:#f0a64a;--waitbg:#33261a;--off:#9d8f8e;--offbg:#2a2222;--steam:#6e5856;--hl:#3a1f1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Apple SD Gothic Neo","Malgun Gothic","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;fill:var(--ink)}
.bg{fill:var(--bg)}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:var(--muted)}.cap{font-size:13px;fill:var(--muted)}
.b{font-size:13.5px;font-weight:650}.l{font-size:11.5px;fill:var(--muted)}.m{font-family:var(--mono);font-size:11px}.c{font-family:var(--mono);font-size:11.5px;fill:var(--red);font-weight:600}
.gl{font-size:11px;font-weight:700;letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.al{font-size:10.5px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.4}.grp{fill:var(--group);stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
.ok .box,.box.ok{fill:var(--okbg);stroke:var(--ok)}.wait .box,.box.wait{fill:var(--waitbg);stroke:var(--wait)}.off .box,.box.off{fill:var(--offbg);stroke:var(--off)}.bad .box,.box.bad{fill:var(--hl);stroke:var(--red)}
.ln{fill:none;stroke:var(--line);stroke-width:1.6}.ln.red{stroke:var(--red)}.ln.okl{stroke:var(--ok)}.ln.waitl{stroke:var(--wait)}.ln.offl{stroke:var(--off)}.ln.dash{stroke-dasharray:5 4}
.mk{fill:var(--line)}.mk.red{fill:var(--red)}.mk.okl{fill:var(--ok)}.mk.waitl{fill:var(--wait)}.mk.offl{fill:var(--off)}
.tok{fill:var(--red);stroke:var(--bg);stroke-width:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tok{display:none}}.hl-job{animation:hl-job 22.52s linear infinite}@keyframes hl-job{0%,0.00%{stroke:var(--line);stroke-width:1.4}0.00%,2.66%{stroke:var(--red);stroke-width:2.6}3.26%,100%{stroke:var(--line);stroke-width:1.4}}.hl-c1{animation:hl-c1 22.52s linear infinite}@keyframes hl-c1{0%,4.01%{stroke:var(--line);stroke-width:1.4}4.61%,7.28%{stroke:var(--red);stroke-width:2.6}7.88%,100%{stroke:var(--line);stroke-width:1.4}}.hl-run{animation:hl-run 22.52s linear infinite}@keyframes hl-run{0%,27.92%{stroke:var(--line);stroke-width:1.4}28.52%,33.85%{stroke:var(--red);stroke-width:2.6}34.45%,100%{stroke:var(--line);stroke-width:1.4}}.hl-next{animation:hl-next 22.52s linear infinite}@keyframes hl-next{0%,37.20%{stroke:var(--line);stroke-width:1.4}37.80%,43.12%{stroke:var(--red);stroke-width:2.6}43.72%,100%{stroke:var(--line);stroke-width:1.4}}.hl-c2{animation:hl-c2 22.52s linear infinite}@keyframes hl-c2{0%,59.57%{stroke:var(--line);stroke-width:1.4}60.17%,62.83%{stroke:var(--red);stroke-width:2.6}63.43%,100%{stroke:var(--line);stroke-width:1.4}}.hl-ok{animation:hl-ok 22.52s linear infinite}@keyframes hl-ok{0%,91.41%{stroke:var(--line);stroke-width:1.4}92.01%,100.00%{stroke:var(--red);stroke-width:2.6}100.00%,100%{stroke:var(--line);stroke-width:1.4}}.hl-g0{animation:hl-g0 22.52s linear infinite}@keyframes hl-g0{0%,11.63%{stroke:var(--line);stroke-width:1.4}12.23%,20.36%{stroke:var(--red);stroke-width:2.6}20.96%,100%{stroke:var(--line);stroke-width:1.4}}.hl-g1{animation:hl-g1 22.52s linear infinite}@keyframes hl-g1{0%,11.63%{stroke:var(--line);stroke-width:1.4}12.23%,20.36%{stroke:var(--red);stroke-width:2.6}20.96%,100%{stroke:var(--line);stroke-width:1.4}}.hl-g2{animation:hl-g2 22.52s linear infinite}@keyframes hl-g2{0%,11.63%{stroke:var(--line);stroke-width:1.4}12.23%,20.36%{stroke:var(--red);stroke-width:2.6}20.96%,100%{stroke:var(--line);stroke-width:1.4}}.hl-g3{animation:hl-g3 22.52s linear infinite}@keyframes hl-g3{0%,11.63%{stroke:var(--line);stroke-width:1.4}12.23%,20.36%{stroke:var(--red);stroke-width:2.6}20.96%,100%{stroke:var(--line);stroke-width:1.4}}.st0{opacity:0;animation:s0 22.52s linear infinite}@keyframes s0{0%,37.80%{opacity:0}38.20%,84.54%{opacity:1}84.94%,100%{opacity:0}}.st1{opacity:0;animation:s1 22.52s linear infinite}@keyframes s1{0%,84.54%{opacity:0}84.94%,92.01%{opacity:1}92.41%,100%{opacity:0}}.st2{opacity:1;animation:s2 22.52s linear infinite}@keyframes s2{0%,92.01%{opacity:0}92.41%,100%{opacity:1}}</style>
<rect class="bg" width="980" height="620" rx="14"/>
<text class="ttl" x="20" y="36">Wie ein Auftrag seinen Ausführer findet</text><text class="sub" x="20" y="56">Kandidaten aus dem Pool der Reihe nach; jeder durchläuft vier Filter</text>
<g class="" id="job"><rect class="box hl-job" x="20" y="78" width="196" height="84" rx="9"/><text class="b" x="31" y="98">Auftrag</text><text class="c" x="31" y="116">job run</text><text class="m" x="31" y="131.5">reviewer · pool=review</text><text class="l" x="31" y="146">Pool = geordnete Liste</text></g>
<rect class="grp" x="20" y="184" width="196" height="214" rx="12"/><text class="gl" x="32" y="201">Kandidaten</text>
<g class="" id="c1"><rect class="box hl-c1" x="32" y="208" width="172" height="52" rx="9"/><text class="b" x="43" y="228">1 · claude</text><text class="m" x="43" y="246">provider: anthropic</text></g>
<g class="" id="c2"><rect class="box hl-c2" x="32" y="270" width="172" height="52" rx="9"/><text class="b" x="43" y="290">2 · codex</text><text class="m" x="43" y="308">provider: openai</text></g>
<g class="" id="c3"><rect class="box hl-c3" x="32" y="332" width="172" height="52" rx="9"/><text class="b" x="43" y="352">3 · groq</text><text class="m" x="43" y="370">openai-compat</text></g>
<rect class="grp" x="240" y="78" width="300" height="320" rx="12"/><text class="gl" x="252" y="95">Filter · nein → nächster</text>
<g class="" id="g0"><rect class="box hl-g0" x="252" y="102" width="276" height="62" rx="9"/><text class="b" x="263" y="122">1. Datenschutz erlaubt es</text><text class="l" x="263" y="140">strikt: nur local / no-train</text></g>
<g class="" id="g1"><rect class="box hl-g1" x="252" y="174" width="276" height="62" rx="9"/><text class="b" x="263" y="194">2. Kann, was nötig ist</text><text class="l" x="263" y="212">Rollenausgaben, Schema, Probe</text></g>
<g class="" id="g2"><rect class="box hl-g2" x="252" y="246" width="276" height="62" rx="9"/><text class="b" x="263" y="266">3. Nicht die Familie des Autors</text><text class="l" x="263" y="284">für Reviews; Autoren aus authors.json</text></g>
<g class="" id="g3"><rect class="box hl-g3" x="252" y="318" width="276" height="62" rx="9"/><text class="b" x="263" y="338">4. Keine Schlüssel und PII</text><text class="l" x="263" y="356">gefunden → ganzer Auftrag stoppt</text></g>
<path class="ln red" d="M470 164 L470 174" marker-end="url(#ared)"/>
<path class="ln red" d="M470 236 L470 246" marker-end="url(#ared)"/>
<path class="ln red" d="M470 308 L470 318" marker-end="url(#ared)"/>
<g class="" id="run"><rect class="box hl-run" x="564" y="78" width="396" height="122" rx="9"/><text class="b" x="575" y="98">Start</text><text class="m" x="575" y="116">spawn(command) · stdin ← prompt</text><text class="l" x="575" y="130.5">Umgebung: nur erlaubte Variablen</text><text class="l" x="575" y="145.5">Schreiber arbeiten in der Kopie, einer nach dem anderen</text><text class="l" x="575" y="160.5">Paket: Rolle, Skills, Vertrag, Prüfungen</text></g>
<g class="ok" id="ok"><rect class="box hl-ok" x="564" y="222" width="188" height="84" rx="9"/><text class="b" x="575" y="242">✓ Schema-Antwort</text><text class="l" x="575" y="260">Code 0: Review → evidence,</text><text class="l" x="575" y="275">Dateien → Commit in Kopie</text></g>
<g class="wait" id="next"><rect class="box hl-next" x="772" y="222" width="160" height="84" rx="9"/><text class="b" x="783" y="242">↻ Limit</text><text class="l" x="783" y="260">zum Nächsten;</text><text class="l" x="783" y="275">Änderung: Commit</text></g>
<g class="bad"><rect class="box" x="564" y="322" width="188" height="76" rx="9"/><text class="b" x="575" y="342">✗ anderer Fehler</text><text class="l" x="575" y="360">Auftrag FAILED;</text><text class="l" x="575" y="375">Antwort bleibt für dich</text></g>
<g class="wait" id="ask"><rect class="box hl-ask" x="772" y="322" width="188" height="76" rx="9"/><text class="b" x="783" y="342">⏸ still &gt; 60 s</text><text class="l" x="783" y="360">Frage; Autopilot</text><text class="l" x="783" y="375">wartet oder gibt ab</text></g>
<rect class="grp" x="20" y="432" width="940" height="104" rx="12"/><text class="gl" x="32" y="449">Kritischer Stopp</text>
<g class="bad"><rect class="box" x="32" y="456" width="296" height="68" rx="9"/><text class="b" x="43" y="476">Pool erschöpft</text><text class="l" x="43" y="494">nur ein Mensch entscheidet</text></g>
<g class=""><rect class="box" x="346" y="456" width="296" height="68" rx="9"/><text class="b" x="357" y="476">stop-report.md · handoff.md</text><text class="m" x="357" y="494">status: WAITING_HUMAN</text><text class="l" x="357" y="508.5">Wiederherstellungspunkt + Kontext</text></g>
<g class="wait"><rect class="box" x="660" y="456" width="288" height="68" rx="9"/><text class="b" x="671" y="476">Du</text><text class="c" x="671" y="494">question answer &lt;id&gt; wait</text><text class="c" x="671" y="509.5">job resume &lt;job&gt;</text></g>
